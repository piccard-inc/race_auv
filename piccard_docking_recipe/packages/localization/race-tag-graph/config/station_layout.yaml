# The station's tag layout in its dock_point frame: operational geometry, not ground truth.
# Source: race_station_description/urdf/base.urdf in GSO-soslab/race_station at commit
# 100bc5a7ac253172b527c036d637da5482eaf0f3 (pinned in packages/simulation/race-auv-docking/source-lock-v1.json),
# the URDF the lab's apriltag fuser loads (race_auv_bringup/config/simulation/apriltag.yaml, object block), where
# each tag is a fixed-joint child of dock_point. The same values are pinned in
# packages/simulation/race-auv-docking/runtime/test_tag_pivot.py. Only the tag36h11 tags the simulation detects are
# listed (the tag25h9 tags are no longer detected; apriltag.yaml). rpy is URDF fixed-axis roll, pitch, yaw.
# size_m is the detector's configured tag size under the black-square-edge convention, from
# race_auv_bringup/config/simulation/apriltag_black_square_edge.yaml on piccard-inc/race_auv piccard/docking-recipe
# (0.8 of the textured face that apriltag.yaml lists); the range noise model uses it (config detections block).
schema: piccard.race-tag-graph.station-layout/v1
frame: dock_point
